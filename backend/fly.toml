# Fly.io — Django API (api.devgirlzz.com.uz)
# Deploy: cd backend && fly launch && fly secrets set DATABASE_URL=... GOOGLE_AI_API_KEY=...
# Custom domain: fly certs add api.devgirlzz.com.uz

app = "devgirlzz-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DEBUG = "False"
  GEMINI_MODEL = "gemini-2.5-flash"
  FRONTEND_URL = "https://devgirlzz.com.uz"
  BACKEND_URL = "https://api.devgirlzz.com.uz"
  ALLOWED_HOSTS = "api.devgirlzz.com.uz,devgirlzz.com.uz,www.devgirlzz.com.uz"
  CORS_ALLOWED_ORIGINS = "https://devgirlzz.com.uz,https://www.devgirlzz.com.uz"
  CSRF_TRUSTED_ORIGINS = "https://devgirlzz.com.uz,https://www.devgirlzz.com.uz,https://api.devgirlzz.com.uz"
  ADMIN_USERNAME = "admin"
  ADMIN_EMAIL = "admin@devgirlzz.com.uz"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Production overlay — VPS with custom domains
# docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build

services:
  backend:
    env_file:
      - ./backend/.env
    environment:
      DEBUG: "False"
      ALLOWED_HOSTS: api.devgirlzz.com.uz,devgirlzz.com.uz,www.devgirlzz.com.uz,backend
      FRONTEND_URL: https://devgirlzz.com.uz
      BACKEND_URL: https://api.devgirlzz.com.uz
      CORS_ALLOWED_ORIGINS: https://devgirlzz.com.uz,https://www.devgirlzz.com.uz
      CSRF_TRUSTED_ORIGINS: https://devgirlzz.com.uz,https://www.devgirlzz.com.uz,https://api.devgirlzz.com.uz
    ports: !reset []

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: https://api.devgirlzz.com.uz/api/
        VITE_DJANGO_ORIGIN: https://api.devgirlzz.com.uz
        VITE_API_DIRECT: "true"
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config:
